include:
  - project: 'vicione-oss/tooling/templates'
    file: '/CI-Templates/v2/dotnet.yml'
  - project: 'vicione-oss/tooling/ci-templates'
    file: '/project/v1/dotnet.yml'
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-test@v2.7.2
    inputs:
      name: 'Test'
      stage: 'test'
      no_build: false
      image: mcr.microsoft.com/dotnet/sdk:10.0
      coverage: true
      config_file: 'tests/testconfig.json'
      before_script:
        - dotnet nuget update source JFrogNuGetProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
        - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
        - dotnet nuget update source IFM-qa --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
        - dotnet nuget update source IFM-iotcore --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
        - dotnet restore

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0

Build:
  extends: .dotnet-build

# The component needs "dotnet Build", which does not exist here; it builds itself (no_build: false)
Test:
  needs: []

Deploy NuGet DeviceTree Contracts:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/ViciOne.DeviceTree.Contracts/ViciOne.DeviceTree.Contracts.csproj'
    REPO: 'JFrogViciOne'

Release NuGet DeviceTree Contracts:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/ViciOne.DeviceTree.Contracts/ViciOne.DeviceTree.Contracts.csproj'
    REPO: 'JFrogViciOne'

Deploy NuGet Communication IoTCore:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/ViciOne.Communication.IoTCore/ViciOne.Communication.IoTCore.csproj'
    REPO: 'JFrogViciOne'

Release NuGet Communication IoTCore:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/ViciOne.Communication.IoTCore/ViciOne.Communication.IoTCore.csproj'
    REPO: 'JFrogViciOne'

