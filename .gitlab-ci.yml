include:
  - project: 'vicione-oss/tooling/templates'
    file: '/CI-Templates/v2/dotnet.yml'
  - project: 'vicione-oss/tooling/ci-templates'
    file: '/project/v1/dotnet.yml'

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0

Build:
  extends: .dotnet-build

Test:
  extends: .dotnet-test-xunit

Deploy NuGet DeviceTree Contracts:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/ViciOne.DeviceTree.Contracts/ViciOne.DeviceTree.Contracts.csproj'
    REPO: 'JFrogViciOne'

Release NuGet DeviceTree Contracts:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/ViciOne.DeviceTree.Contracts/ViciOne.DeviceTree.Contracts.csproj'
    REPO: 'JFrogViciOne'

Deploy NuGet Communication IoTCore:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/ViciOne.Communication.IoTCore/ViciOne.Communication.IoTCore.csproj'
    REPO: 'JFrogViciOne'

Release NuGet Communication IoTCore:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/ViciOne.Communication.IoTCore/ViciOne.Communication.IoTCore.csproj'
    REPO: 'JFrogViciOne'

Deploy NuGet Communication Vse:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/ViciOne.Communication.Vse/ViciOne.Communication.Vse.csproj'
    REPO: 'JFrogViciOne'

Release NuGet Communication Vse:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/ViciOne.Communication.Vse/ViciOne.Communication.Vse.csproj'
    REPO: 'JFrogViciOne'

Deploy NuGet Driver IoTCore:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/ViciOne.Driver.IoTCore/ViciOne.Driver.IoTCore.csproj'
    REPO: 'JFrogViciOne'

Release NuGet Driver IoTCore:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/ViciOne.Driver.IoTCore/ViciOne.Driver.IoTCore.csproj'
    REPO: 'JFrogViciOne'

Deploy NuGet Driver Vse:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/ViciOne.Driver.Vse/ViciOne.Driver.Vse.csproj'
    REPO: 'JFrogViciOne'

Release NuGet Driver Vse:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/ViciOne.Driver.Vse/ViciOne.Driver.Vse.csproj'
    REPO: 'JFrogViciOne'

Prerelease Raw:
  extends: .dotnet-deploy-raw-rids
  variables:
    SERVER: 'https://ifm.jfrog.io/artifactory/vicione-suite-dev'
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    PROJECT: 'src/ViciOne.Driver.IoTCore/ViciOne.Driver.IoTCore.csproj'
    DST_DIRECTORY: 'fbs/ViciOne.Driver.IoTCore'
    METADATA_FILE: 'src/ViciOne.Driver.IoTCore/metadata.json'
    METADATA_VERSION_FILE: 'VERSION'
    METADATA_MIN_VERSION_FILE: 'VERSION_CORE'
    METADATA_MIN_VERSION_KEY: 'MinCoreVersion'
  after_script:
    - !reference [.push-metadata]

Release Raw:
  extends: .dotnet-release-raw-rids
  variables:
    SERVER: 'https://ifm.jfrog.io/artifactory/vicione-suite-staging'
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    PROJECT: 'src/ViciOne.Driver.IoTCore/ViciOne.Driver.IoTCore.csproj'
    DST_DIRECTORY: 'fbs/ViciOne.Driver.IoTCore'
    METADATA_FILE: 'src/ViciOne.Driver.IoTCore/metadata.json'
    METADATA_VERSION_FILE: 'VERSION'
    METADATA_MIN_VERSION_FILE: 'VERSION_CORE'
    METADATA_MIN_VERSION_KEY: 'MinCoreVersion'
  after_script:
    - !reference [.push-metadata]

# Public Release
Public Release Raw:
  extends: .dotnet-release-public
